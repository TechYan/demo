name: Deploy demo portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Run the existing site tests and content checks before deployment'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
        if: github.event_name != 'workflow_dispatch' || inputs.run_checks
      - run: npm run build:github
      - run: python scripts/check_site.py dist /demo
        if: github.event_name != 'workflow_dispatch' || inputs.run_checks
      - run: python scripts/build_uvm_svip.py --check
        if: github.event_name != 'workflow_dispatch' || inputs.run_checks
      - run: python scripts/build_register_demos.py --check
        if: github.event_name != 'workflow_dispatch' || inputs.run_checks
      - run: python scripts/build_wavedbg_examples.py --check
        if: github.event_name != 'workflow_dispatch' || inputs.run_checks
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
